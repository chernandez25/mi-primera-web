<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola, soy Carlos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #f4a261;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: background-color 0.5s ease;
    }

    .tarjeta {
      width: 100%;
      max-width: 480px;
      padding: 56px 32px;
      text-align: center;
      background-color: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    h1 {
      margin-bottom: 32px;
      font-size: clamp(2rem, 8vw, 3rem);
      color: #22223b;
    }

    button {
      padding: 14px 28px;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background-color: #22223b;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    button:hover {
      background-color: #3a3a5c;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid #22223b;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Hola, soy Carlos</h1>
    <button id="boton-color" type="button">Cambiar color de fondo</button>
  </main>

  <script>
    // Lista de colores: añade o cambia los que quieras
    const colores = ["#f4a261", "#2a9d8f", "#e76f51", "#8ab6d6", "#b5838d", "#e9c46a"];
    let posicion = 0;

    document.getElementById("boton-color").addEventListener("click", function () {
      // Pasa al siguiente color y vuelve al primero al llegar al final
      posicion = (posicion + 1) % colores.length;
      document.body.style.backgroundColor = colores[posicion];
    });
  </script>
</body>
</html>
